name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install a virtual display (the test suite opens real Swing windows)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build
        run: ./compile.sh

      - name: Run the 44 test scenarios
        run: xvfb-run -a ./test.sh
